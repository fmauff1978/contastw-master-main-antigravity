<div class="py-8 px-4 mx-auto max-w-4xl lg:py-16">
    <div class="flex items-center justify-between mb-4">
    <h2 class="mb-4 text-xl font-bold text-gray-900 dark:text-white">Cadastrar Lançamento Creditando Várias</h2>
    <button type="button" (click)="onSubmit()" class = "text-white bg-blue-700 hover:bg-blue-800 focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm px-5 
    py-2.5 me-2 mb-2 dark:bg-blue-600 dark:hover:bg-blue-700 focus:outline-none dark:focus:ring-blue-800">Gravar em Lote</button>
</div>

<div *ngIf="isLoading">
    <app-spinner></app-spinner>
  </div>

  <app-alert 
[showAlert]="showAlert"
[title]="alertTitle"
[message]="alertMessage"
[alertType]="alertType"
(close)="closeAlert()"></app-alert>

<form [formGroup]="meuForm" >          
      <div class="flex items-center gap-10 max-w-4xl ">
        <div class="max-w-4xl max-w-48 ml-0 mb-5">
            <label for="contadebitada" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Conta a ser Debitada</label>
            <select id="contadebitada" formControlName="contadebitada" class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg 
            focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700 dark:border-gray-600
             dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500">
             <option  *ngFor="let cat of items" value="{{cat.id}}-{{cat.cod}}-{{cat.conta}}-{{cat.natureza}}-{{cat.enquadramento}}-{{cat.mod_despesa}}">
              {{ cat.conta }}
            </option>                 
            </select>                
        </div>
        <button class="content-center mb-1" (click)="addComplemento()" type="button">
            <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14m-7 7V5"/>
              </svg>                                    
        </button>
    </div>
    

    <div  [formGroup]="meuForm" formArrayName="complementos">
        <div *ngFor="let x of complementos?.controls; let i = index"  [formGroupName]="i" class="flex gap-4 mb-4">
        

            <div class="max-w-48 ">    
              <label for="data" class="block text-gray-700 text-sm font-bold mb-2">Data:</label>
              <input type="date" id="data" formControlName="datalcto" class="shadow appearance-none border rounded  py-2 px-3 text-gray-700 leading-tight focus:outline-none focus:shadow-outline">
            </div>
           
          
            <div class="max-w-96 ml-0 ">
                <label for="name" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Descrição</label>
                <input type="text" formControlName="descricao" name="name" id="descricao"
                 class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
                  focus:ring-primary-600 focus:border-primary-600 
                  block  p-2.5 dark:bg-gray-700 dark:border-gray-600
                   dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="Descreva o lançamento" required="">
            </div>
    

            <div class="max-w-48 ml-0 ">
                <label for="contacreditada" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Conta Creditada</label>
                <select id="contacreditada" formControlName="contacreditada"    class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg
                 focus:ring-primary-500 focus:border-primary-500 block w-full p-2.5 dark:bg-gray-700
                  dark:border-gray-600 dark:placeholder-gray-400 dark:text-white dark:focus:ring-primary-500
                   dark:focus:border-primary-500">
                  <option  *ngFor="let cat of items" value="{{cat.id}}-{{cat.cod}}-{{cat.conta}}-{{cat.natureza}}-{{cat.enquadramento}}-{{cat.mod_despesa}}">
                    {{ cat.conta }}
                  </option>
                </select>
            </div>

            <div class="max-w-48">
                <label for="valor" class="block mb-2 text-sm font-medium text-gray-900 dark:text-white">Valor</label>
                <input type="number" formControlName="valor" name="valor" id="valor" class="bg-gray-50 border border-gray-300
                 text-gray-900 text-sm rounded-lg focus:ring-primary-600 focus:border-primary-600 block p-2.5 
                 dark:bg-gray-700 dark:border-gray-600 dark:placeholder-gray-400 dark:text-white 
                 dark:focus:ring-primary-500 dark:focus:border-primary-500" placeholder="R$ 1.000,00" required="">
            </div>
    
        <button class="content-center mt-5" (click)="remove(i)" type="button">
            <svg class="w-6 h-6 text-gray-800 dark:text-white" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" viewBox="0 0 24 24">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 7h14m-9 3v8m4-8v8M10 3h4a1 1 0 0 1 1 1v3H9V4a1 1 0 0 1 1-1ZM6 7h12v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7Z"/>
              </svg>                  
        </button>
    </div>
</div>
    </form>
