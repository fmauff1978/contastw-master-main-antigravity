  <div class="container mx-auto mt-8 ">
    <div class="mb-6 flex justify-items text-2xl">
        <h1 class="mr-10">{{mesatual}}/{{ano}}</h1>  
        <h1>{{montante|currency:'BRL'}}</h1>
        
        <button type="button" (click)="anterior()" class="text-white bg-blue-700  hover:bg-blue-800 
        focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm 
        px-5 py-2.5 me-2 mb-4 dark:bg-blue-600 dark:hover:bg-blue-700
         focus:outline-none ml-4 dark:focus:ring-blue-800">Mês Anterior</button>

       
        <button type="button" (click)="prox()" class="text-white bg-blue-700  hover:bg-blue-800 
        focus:ring-4 focus:ring-blue-300 font-medium rounded-lg text-sm 
        px-5 py-2.5 me-2 mb-4 dark:bg-blue-600 dark:hover:bg-blue-700
         focus:outline-none ml-4 dark:focus:ring-blue-800">Próximo Mês</button>
      
       
    </div>
   

    <table class="min-w-full bg-white mb-12">
      <thead class="py-2 px-4 border-b cursor-pointer text-left">
        <tr>
          <th
            class="py-2 px-4 border-b cursor-pointer"
            (click)="sortTable('dataparcela')"
          >
            Data
          </th>
          <th
            class="py-2 px-4 border-b cursor-pointer"
            (click)="sortTable('cartaovinculado')"
          >
            Cartão         </th>
          <th
            class="py-2 px-4 border-b cursor-pointer"
            (click)="sortTable('descricao')"
          >
            Descricao
          </th>
          <th
            class="py-2 px-4 border-b cursor-pointer"
            (click)="sortTable('debito')"
          >
            Parcela
          </th>
          <th
            class="py-2 px-4 border-b cursor-pointer"
            (click)="sortTable('valorparcela')"
          >
            Valor
          </th>
        
          <th
            class="py-2 px-4 border-b cursor-pointer"
            (click)="sortTable('valor')"
          >
            Ações
          </th>
        </tr>
      </thead>
      <tbody>
        <tr
          *ngFor="
            let item of parc 
          "
        >
          <td class="py-2 px-4 border-b">{{item.dataparcela.toDate()|date:'dd/MM/yyyy'}}</td>
          <td class="py-2 px-4 border-b">
            {{item.cartaovinculado}}
          </td>
          <td class="py-2 px-4 border-b">{{ item.descricao }}</td>
          <td class="py-2 px-4 border-b">{{item.nroparcela}}/{{item.qtdeparcelas}}</td>
          <td class="py-2 px-4 border-b">{{item.valorparcela|currency:'BRL'}}</td>
        
          <td class="py-2 px-4 border-b">
            <button (click)="excluirData(item)">
              <svg
                class="w-6 h-6 text-gray-800 dark:text-white"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                fill="none"
                viewBox="0 0 24 24"
              >
                <path
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M5 7h14m-9 3v8m4-8v8M10 3h4a1 1 0 0 1 1 1v3H9V4a1 1 0 0 1 1-1ZM6 7h12v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V7Z"
                />
              </svg>
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  
    
  </div>
