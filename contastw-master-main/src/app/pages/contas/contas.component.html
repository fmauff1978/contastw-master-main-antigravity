<div
  *ngIf="showModal2"
  class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 overflow-y-auto bg-gray-900/60 backdrop-blur-xs transition-opacity animate-in fade-in duration-200"
>
  <div
    class="relative w-full max-w-lg bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-100 dark:border-gray-700 overflow-hidden transform transition-all"
  >
    <!-- Alerta do Modal -->
    <app-alert
      [showAlert]="showAlert"
      [title]="alertTitle"
      [message]="alertMessage"
      [alertType]="alertType"
      (close)="closeAlert()"
    ></app-alert>

    <!-- Cabeçalho do Modal -->
    <div
      class="flex items-center justify-between px-6 py-5 border-b border-gray-100 dark:border-gray-700 bg-gray-50/50 dark:bg-gray-800/80"
    >
      <div class="flex items-center gap-3">
        <div
          class="flex items-center justify-center w-10 h-10 rounded-xl bg-indigo-50 text-indigo-600 dark:bg-indigo-950/50 dark:text-indigo-400 border border-indigo-100 dark:border-indigo-900/50"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M12 4v16m8-8H4"
            />
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h2 class="text-lg font-bold text-gray-900 dark:text-white">
              Nova Conta Contábil
            </h2>
            <span
              *ngIf="cod0"
              class="font-mono text-xs font-bold px-2 py-0.5 rounded-md bg-indigo-100 text-indigo-700 dark:bg-indigo-900/60 dark:text-indigo-300"
            >
              #{{ cod0 }}
            </span>
          </div>
          <p class="text-xs text-gray-500 dark:text-gray-400">
            Cadastre uma nova conta no plano financeiro.
          </p>
        </div>
      </div>

      <!-- Botão Fechar (X) -->
      <button
        type="button"
        (click)="closeModal()"
        class="p-2 rounded-xl text-gray-400 hover:text-gray-600 hover:bg-gray-100 dark:hover:text-gray-300 dark:hover:bg-gray-700 transition cursor-pointer"
        title="Fechar"
      >
        <svg
          class="w-5 h-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>

    <!-- Formulário -->
    <form [formGroup]="meuForm" class="p-6 space-y-4">
      <!-- Nome da Conta -->
      <div>
        <label
          class="block text-xs font-semibold uppercase tracking-wider text-gray-700 dark:text-gray-300 mb-1.5"
        >
          Nome da Conta <span class="text-rose-500">*</span>
        </label>
        <input
          type="text"
          formControlName="conta"
          placeholder="Ex: Nubank Reserva, Alimentação, Aluguel..."
          class="w-full px-3.5 py-2.5 text-sm bg-gray-50 dark:bg-gray-900/50 border border-gray-300 dark:border-gray-600 rounded-xl text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition"
        />
      </div>

      <!-- Natureza e Enquadramento -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label
            class="block text-xs font-semibold uppercase tracking-wider text-gray-700 dark:text-gray-300 mb-1.5"
          >
            Natureza <span class="text-rose-500">*</span>
          </label>
          <select
            id="natureza"
            formControlName="natureza"
            class="w-full px-3.5 py-2.5 text-sm bg-gray-50 dark:bg-gray-900/50 border border-gray-300 dark:border-gray-600 rounded-xl text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition capitalize"
          >
            <option value="" disabled selected>Selecione...</option>
            <option *ngFor="let cat of natureza" [value]="cat">
              {{ cat }}
            </option>
          </select>
        </div>

        <div>
          <label
            class="block text-xs font-semibold uppercase tracking-wider text-gray-700 dark:text-gray-300 mb-1.5"
          >
            Enquadramento <span class="text-rose-500">*</span>
          </label>
          <select
            id="enquadramento"
            formControlName="enquadramento"
            class="w-full px-3.5 py-2.5 text-sm bg-gray-50 dark:bg-gray-900/50 border border-gray-300 dark:border-gray-600 rounded-xl text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition capitalize"
          >
            <option value="" disabled selected>Selecione...</option>
            <option *ngFor="let cat of enq" [value]="cat.enquadramento">
              {{ cat.enquadramento }}
            </option>
          </select>
        </div>
      </div>

      <!-- Modalidade Despesa -->
      <div>
        <label
          class="block text-xs font-semibold uppercase tracking-wider text-gray-700 dark:text-gray-300 mb-1.5"
        >
          Modalidade de Despesa
        </label>
        <select
          id="mod_despesa"
          formControlName="mod_despesa"
          class="w-full px-3.5 py-2.5 text-sm bg-gray-50 dark:bg-gray-900/50 border border-gray-300 dark:border-gray-600 rounded-xl text-gray-900 dark:text-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition capitalize"
        >
          <option value="" disabled selected>Selecione a modalidade...</option>
          <option *ngFor="let cat of mod_despesa" [value]="cat">
            {{ cat }}
          </option>
        </select>
      </div>

      <!-- Rodapé / Ações -->
      <div
        class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100 dark:border-gray-700"
      >
        <button
          type="button"
          (click)="closeModal()"
          class="px-4 py-2.5 text-sm font-semibold text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-700 hover:bg-gray-100 dark:hover:bg-gray-600 border border-gray-300 dark:border-gray-600 rounded-xl transition cursor-pointer"
        >
          Cancelar
        </button>
        <button
          type="button"
          (click)="saveChanges()"
          [disabled]="meuForm.invalid"
          class="inline-flex items-center justify-center gap-2 px-5 py-2.5 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 disabled:opacity-50 disabled:cursor-not-allowed rounded-xl shadow-md shadow-indigo-600/20 transition cursor-pointer focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M5 13l4 4L19 7"
            />
          </svg>
          Cadastrar Conta
        </button>
      </div>
    </form>
  </div>
</div>
