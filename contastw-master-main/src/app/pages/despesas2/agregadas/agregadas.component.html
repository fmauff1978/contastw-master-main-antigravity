<div class="flex flex-wrap justify-center gap-4">  <!-- Container Flex -->
    <div class="w-full max-w-md p-4 bg-white border border-gray-200 rounded-lg shadow-sm sm:p-8 dark:bg-gray-800 dark:border-gray-700">
      <div class="flex items-center justify-center mb-4">
          <h5 class="text-xl font-bold text-gray-900 dark:text-white ">Ativo</h5>
      </div>
  
      <div class="relative overflow-x-auto">
        <div style="max-height: 300px; overflow-y: auto;">
         <table class="w-full text-xs text-center rtl:text-right text-gray-500 dark:text-gray-400">
          <thead class="text-xs text-gray-700 uppercase bg-gray-50 dark:bg-gray-700 dark:text-gray-400">
              <tr>
                  <th scope="col" class="px-6 py-3">
                      Cod
                  </th>
                  <th scope="col" class="px-6 py-3">
                      Conta
                  </th>
  
                  <th scope="col" class="px-6 py-3">
                      Saldo
                  </th>
              </tr>
          </thead>
          <tbody>
              <tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200" *ngFor="let item of ctasAtivo()">
                  <td scope="row" class="px-6 py-4 ">
                      {{item.cod}}
                  </td>
                  <td class="px-6 py-4">
                      {{item.conta}}
                  </td>
  
                  <td class="px-6 py-4">
                      {{item.saldo|currency: 'BRL'}}
                   </td>
              </tr>
          </tbody>
         </table>
        </div>
      </div>
    </div>
  
    <div class="w-full max-w-md p-4 bg-white border border-gray-200 rounded-lg shadow-sm sm:p-8 dark:bg-gray-800 dark:border-gray-700">
      <div class="flex items-center justify-center mb-4">
          <h5 class="text-xl font-bold text-gray-900 dark:text-white ">Passivo</h5>
      </div>

                  </th>
                  <th scope="col" class="px-6 py-3">
                      Conta
                  </th>
  
                  <th scope="col" class="px-6 py-3">
                      Saldo
                  </th>
              </tr>
          </thead>
          <tbody>
              <tr class="bg-white border-b dark:bg-gray-800 dark:border-gray-700 border-gray-200" *ngFor="let item of ctasPassivo()">

                      {{item.cod}}
                  </td>

                      {{item.conta}}
                  </td>
  
                  <td class="px-6 py-4">
                      {{item.saldo*-1|currency: 'BRL'}}
                   </td>
              </tr>
          </tbody>
         </table>
        </div>
      </div>
    </div>
