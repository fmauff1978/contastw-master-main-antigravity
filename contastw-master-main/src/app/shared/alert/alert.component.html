<div *ngIf="showAlert" class="fixed inset-0 flex items-center justify-center z-50">
    <div class="bg-black bg-opacity-50 absolute inset-0"></div>
    <div class="bg-white p-6 rounded-md shadow-lg relative z-10">
        <h2 class="text-lg font-semibold mb-4" [class.text-red-600]="alertType === 'error'"  [class.text-green-600]="alertType === 'success'">{{ title }}</h2>
        <p class="mb-4">{{ message }}</p>
        <div class="flex justify-end">
          <button (click)="closeAlert()" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-md text-gray-700 focus:outline-none focus:ring focus:ring-gray-200">Fechar</button>
        </div>
    </div>
  </div>
