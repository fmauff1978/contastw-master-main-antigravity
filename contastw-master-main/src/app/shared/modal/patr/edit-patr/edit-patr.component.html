<div *ngIf="showModalEdit" class="fixed inset-0 flex items-center justify-center z-50">
  <div class="bg-black bg-opacity-50 absolute inset-0"></div>
  <div class="bg-white p-6 rounded-md shadow-lg relative z-10 w-full max-w-md">
      <h2 class="text-lg font-semibold mb-4">Editar Bem {{item.nome}}  </h2>


          <div class="mb-4">
              <label class="block text-sm font-medium text-gray-700">Valor Atual</label>
               <input type="number" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-300 focus:ring focus:ring-indigo-200 focus:ring-opacity-50" [(ngModel)]="editedItem.valor_atual" />
         </div>


      <div class="flex justify-end">
          <button (click)="closeModal()" class="bg-gray-200 hover:bg-gray-300 px-4 py-2 rounded-md text-gray-700 mr-2 focus:outline-none focus:ring focus:ring-gray-200">Cancelar</button>
          <button (click)="saveChanges()" class="bg-indigo-600 hover:bg-indigo-700 px-4 py-2 rounded-md text-white focus:outline-none focus:ring focus:ring-indigo-200">Salvar</button>
      </div>
  </div>
</div>
