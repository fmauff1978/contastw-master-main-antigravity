<div
  *ngIf="showModal"
  class="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 overflow-y-auto bg-gray-900/60 backdrop-blur-xs transition-opacity animate-in fade-in duration-200"
>
  <div
    class="relative w-full max-w-md bg-white dark:bg-gray-800 rounded-2xl shadow-2xl border border-gray-100 dark:border-gray-700 overflow-hidden transform transition-all"
  >
    <!-- Cabeçalho do Modal -->
    <div
      class="flex items-center justify-between px-6 py-5 border-b border-gray-100 dark:border-gray-700 bg-gray-50/50 dark:bg-gray-800/80"
    >
      <div class="flex items-center gap-3">
        <div
          class="flex items-center justify-center w-10 h-10 rounded-xl bg-purple-50 text-purple-600 dark:bg-purple-950/50 dark:text-purple-400 border border-purple-100 dark:border-purple-900/50"
        >
          <svg
            class="w-5 h-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"
            />
          </svg>
        </div>
        <div>
          <h2 class="text-lg font-bold text-gray-900 dark:text-white">
            Editar Mês {{ item?.mes?.toDate() | date: "MM/yyyy" }}
          </h2>
          <p class="text-xs text-gray-500 dark:text-gray-400">
            Atualize os valores de aporte e rendimento do mês.
          </p>
        </div>
      </div>

      <!-- Botão Fechar (X) -->
      <button
        type="button"
        (click)="closeModal()"
        class="p-2 rounded-xl text-gray-400 hover:text-gray-600 hover:bg-gray-100 dark:hover:text-gray-300 dark:hover:bg-gray-700 transition cursor-pointer"
        title="Fechar"
      >
        <svg
          class="w-5 h-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M6 18L18 6M6 6l12 12"
          />
        </svg>
      </button>
    </div>

    <!-- Conteúdo do Formulário -->
    <div class="p-6 space-y-4">
      <!-- Contribuição -->
      <div>
        <label
          for="contribuicao"
          class="block text-xs font-semibold uppercase tracking-wider text-gray-700 dark:text-gray-300 mb-1.5"
        >
          Contribuição / Aporte (R$)
        </label>
        <div class="relative">
          <div
            class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400 font-semibold text-xs"
          >
            R$
          </div>
          <input
            type="number"
            id="contribuicao"
            step="0.01"
            [(ngModel)]="editedItem.contribuicao"
            placeholder="0,00"
            class="w-full pl-9 pr-3.5 py-2.5 text-sm bg-gray-50 dark:bg-gray-900/50 border border-gray-300 dark:border-gray-600 rounded-xl text-gray-900 dark:text-white focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition font-medium"
          />
        </div>
      </div>

      <!-- Rendimento -->
      <div>
        <label
          for="rendimento"
          class="block text-xs font-semibold uppercase tracking-wider text-gray-700 dark:text-gray-300 mb-1.5"
        >
          Rendimento do Mês (R$)
        </label>
        <div class="relative">
          <div
            class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400 font-semibold text-xs"
          >
            R$
          </div>
          <input
            type="number"
            id="rendimento"
            step="0.01"
            [(ngModel)]="editedItem.rendimento"
            placeholder="0,00"
            class="w-full pl-9 pr-3.5 py-2.5 text-sm bg-gray-50 dark:bg-gray-900/50 border border-gray-300 dark:border-gray-600 rounded-xl text-gray-900 dark:text-white focus:ring-2 focus:ring-purple-500 focus:border-purple-500 transition font-medium"
          />
        </div>
      </div>

      <!-- Rodapé / Ações -->
      <div
        class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100 dark:border-gray-700"
      >
        <button
          type="button"
          (click)="closeModal()"
          class="px-4 py-2.5 text-sm font-semibold text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-700 hover:bg-gray-100 dark:hover:bg-gray-600 border border-gray-300 dark:border-gray-600 rounded-xl transition cursor-pointer"
        >
          Cancelar
        </button>
        <button
          type="button"
          (click)="saveChanges()"
          class="inline-flex items-center justify-center gap-2 px-5 py-2.5 text-sm font-semibold text-white bg-purple-600 hover:bg-purple-700 active:bg-purple-800 rounded-xl shadow-md shadow-purple-600/20 transition cursor-pointer focus:outline-none focus:ring-2 focus:ring-purple-500 focus:ring-offset-2"
        >
          <svg
            class="w-4 h-4"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M5 13l4 4L19 7"
            />
          </svg>
          Salvar Alterações
        </button>
      </div>
    </div>
  </div>
</div>
